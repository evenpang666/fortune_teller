<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#23745e"><meta name="description" content="观象 · 以传统文化与 AI，探索自我与生活的更多可能。"><title>观象 · AI 命理工作室</title><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script></head>
<body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><dialog id="confirm-dialog" aria-labelledby="delete-dialog-title" aria-describedby="delete-record-context delete-record-warning"><form method="dialog"><div class="eyebrow">记录管理</div><h2 id="delete-dialog-title">删除这条记录？</h2><p id="delete-record-context" class="question-quote"></p><p id="delete-record-warning" class="muted">排盘数据与解读会一起删除，无法恢复。其他设备也将无法查看这条记录。</p><div class="dialog-actions"><button value="cancel" class="button secondary" autofocus>保留记录</button><button value="delete" class="button danger">确认删除</button></div></form></dialog><dialog id="share-dialog" aria-labelledby="share-dialog-title" aria-describedby="share-snapshot-note"><div class="eyebrow">SHARE YOUR MOMENT</div><h2 id="share-dialog-title">分享这份盘面</h2><p id="share-record-title" class="question-quote"></p><p id="share-snapshot-note" class="muted"></p><button type="button" class="button full" data-action="save-share">保存盘面网页 ↓</button><p class="tiny">保存为独立 HTML 文件，可离线打开，或通过聊天、邮件发送。</p><label class="field"><span>分享记录链接</span><input id="share-url" type="text" readonly></label><p class="tiny">链接需要工作室服务保持运行，接收者与本机处于同一局域网；保存的网页不受此限制。</p><div class="dialog-actions"><button type="button" class="button secondary" data-action="close-share">关闭</button><button type="button" class="button secondary" data-action="copy-share">复制链接 ↗</button></div></dialog></body>
</html>
